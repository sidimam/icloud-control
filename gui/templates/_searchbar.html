{# Campo Cerca sempre visibile (3.14): testo completo nell'indice; gli altri parametri della pagina restano. #}
<form method="get" class="list" style="margin-bottom:1rem">{% for k, v in request.args.items(multi=True) if k not in ('q', 'page') %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
<div class="li"><span class="badge b-gray">{{ icon('search', 16) }}</span><input name="q" value="{{ request.args.get('q', '') }}" placeholder="{{ sb_placeholder }}" aria-label="{{ _('Cerca') }}" style="flex:1"><button class="small">{{ _('Cerca') }}</button>{% if request.args.get('q') %}<a href="?{% for k, v in request.args.items(multi=True) if k not in ('q', 'page') %}{{ k }}={{ v|urlencode }}&{% endfor %}" class="mut">{{ _('Azzera') }}</a>{% endif %}</div></form>
