{% extends "base.html" %}{% block body %}
<div class="narrow"><h1 class="title">{{ _('Verifica in due passaggi') }}</h1>
<p class="note">{{ _("Profilo {a0}: inserisci il codice a 6 cifre dell'app di autenticazione, oppure uno dei codici di recupero (tipo k7m2-x9qp).", a0=user) }}</p>
<form method="post" action="/login/2fa"><input type="hidden" name="next" value="{{next}}">
<div class="list"><div class="li col"><label class="f" for="code">{{ _('Codice') }}</label><input id="code" name="code" autocomplete="one-time-code" maxlength="12" autofocus required></div></div>
<div class="row" style="margin-top:1rem"><button>{{ _('Verifica') }}</button><a href="/login">{{ _('Annulla') }}</a></div></form>
<p class="note"><a href="/recover">{{ _('Telefono perso?') }}</a></p></div>{% endblock %}
